# Server Configuration
server.port=8088

# Spring Application
spring.application.name=wf-message-archive-server

# MySQL DataSource Configuration (used when source-type=mysql)
archive.mysql.url=jdbc:mysql://localhost:3306/wfchat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
archive.mysql.username=root
archive.mysql.password=123456

# Archive Service Configuration
# Data source type: mysql or mongodb
archive.source-type=mysql

# MongoDB Configuration (used when source-type=mongodb)
archive.mongodb.uri=mongodb://wfc:123456@localhost:27017/wfchat
archive.mongodb.database=wfchat

# ClickHouse Configuration
archive.clickhouse.url=jdbc:clickhouse:http://localhost:8123/wfchat
archive.clickhouse.username=default
archive.clickhouse.password=123456
archive.clickhouse.table=message_archive
# ClickHouse 批量写入最大批次大小，默认 5000
archive.clickhouse.max-batch-size=5000

# Archive Task Configuration
# Whether to enable archive sync on this node
# Multiple nodes can enable this, but only one will acquire the lock
archive.task.enabled=true
archive.task.quiet-time-start=02:00
archive.task.quiet-time-end=01:00
archive.task.batch-size=500
archive.task.batch-interval-ms=1000
archive.task.batches-per-cycle=10
# 同步历史消息的天数，默认 365 天（1年）
# 只同步 N 天**之前**的消息（旧消息）
# 设置为 0 表示同步所有消息
archive.task.sync-history-days=0

# Wildfire IM Service Configuration
im.admin-url=http://localhost:18080
im.secret=123456

# Logging Configuration
logging.level.cn.wildfirechat.archive=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
